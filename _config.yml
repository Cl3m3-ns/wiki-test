title: AMPEL Wiki
description: Statischer Markdown-Implementationsleitfaden für das AMPEL-Projekt

url: "https://cl3m3-ns.github.io"
baseurl: "/wiki-test"

theme: just-the-docs
permalink: pretty

search_enabled: true
color_scheme: light
heading_anchors: true
nav_sort: case_sensitive

# Unterkapitel werden bereits auf den Übersichtsseiten gepflegt.
# Deshalb keine zusätzliche, automatisch erzeugte Kindseiten-Liste ausgeben.
defaults:
  - scope:
      path: ""
    values:
      has_toc: false

last_edit_timestamp: true
last_edit_time_format: "%d.%m.%Y"

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .obsidian
  - docs/.obsidian
